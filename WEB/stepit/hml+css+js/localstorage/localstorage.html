        <table>
            <thead>
                <tr>
                    <th>Nr.</th>
                    <th>Produs</th>
                    <th>Pret</th>
                    <th>Cantitate</th>
                    <th>Actiuni</th>

            </thead>
            <tbody id="tabel"></tbody>
        </table>

    <script src="localstorage_script.js"></script>
</body>
</html>
