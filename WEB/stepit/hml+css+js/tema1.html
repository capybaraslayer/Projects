<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        adunare=(valoare,elementCurent)=>{
           return valoare+elementCurent; 
        }
        scadere=(valoare,elementCurent)=>{
           return valoare-elementCurent; 
        }
        inmultire=(valoare,elementCurent)=>{
           return valoare*elementCurent; 
        }
        impartire=(valoare,elementCurent)=>{
           return valoare/elementCurent; 
        }
        function calculator(){
            let egal=false;
            let valoare=0;
            while(!egal){
    
                let operatiune=prompt('Operatiune');
                if (operatiune=='='){
                    egal=true;
                    break;
                }
                let elementCurent=Number(prompt('Valoare'));
                if(!Number(elementCurent))
                {
                    alert('Introduceti doar cifre');
                    continue;
                }
                switch (operatiune) {
                    case '+': valoare = adunare(valoare, elementCurent); break;
                    case '-': valoare = scadere(valoare, elementCurent); break;
                    case '*': valoare = inmultire(valoare, elementCurent); break;
                    case '/': 
                        if (elementCurent === 0) {
                            alert('Nu poți împărți la zero!');
                        } else {
                            valoare = impartire(valoare, elementCurent);
                        }
                        break;
                    default:
                        alert('Simbol invalid!');
               }

                
        
            }
            document.write('<h1>'+`Rezultat:${valoare}`+'</h1>');
            
        
        
        }
        calculator();
        

    </script>
</body>
</html>
