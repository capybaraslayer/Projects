        function afiseaza_nume(nume){

        //functie returnabila
        function suma(a,b,c){
            return (a+b+c);
        }
        function salariu(salariubaza,nr_zile,procent){
            
            let sumaprocent = ((salariubaza*nr_zile)*procent)/100;
            let salariufinal=(salariubaza*nr_zile)-sumaprocent;
            // console.log("Salariu va fi de "+salariufinal+" cu procentul de "+procent);
            return salariufinal;

        }

        let n=10
        let sumaa;
        for(let i =1;i<n;i++){
            let salariuZi=1000*i;
            let nrZile=10+i;
            let sal=salariu(salariuZi,nrZile,21);
            console.log(`Pentru ${nrZile} de zile lucrate cu salariu zilnic de 
                        ${salariuZi}lei  avem salariu de ${sal}`);
