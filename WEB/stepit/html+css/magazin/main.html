<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Estore</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="header">
            <nav class="menu">
                <div class="logo"><img src="gadgetzone_logo.svg" /></div>

            </nav>
            <div class="banner-wrapper">
                <div class="banner"></div>
            </div>
        </div>
        <div class="cards">
            <div class="card">
                <div class="badge"> -50% </div>
            </div>
            <div class="card">

            </div>
            <div class="card">

            </div>
            <div class="card">
                <div class="badge"> -50% </div>
            </div>
        </div>
        <div class="abonare-box">
            <div class="abonare-text">
                <h1>Abonează-te!</h1>
            <p>Înscrie-te acum și fii la curent cu cele mai avantajoase oferte</p>
            </div>
            <form class="abonare-form">
                <input type="text" placeholder="Nume"/>
                <input type="email" placeholder="Email"/>
                <input type="tel" placeholder="Numar de telefon"/>
                <button type="submit">Abonează-mă!</button>
            </form>
        </div>
        <div class="footer">
        <p> 2026 GadgetZone. Toate drepturile rezervate.</p>
