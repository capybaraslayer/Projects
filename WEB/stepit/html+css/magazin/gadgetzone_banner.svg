<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>GadgetZone Banner</title>
  <desc>Banner promoțional dark tech pentru GadgetZone cu produse electronice și efecte neon albastre.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#090c18"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="glowLeft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1a4fa0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a4fa0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowRight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="discountBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="420" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">

    <!-- Background -->
    <rect x="0" y="0" width="1200" height="420" fill="url(#bgGrad)"/>

    <!-- Grid -->
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="140" y1="0" x2="140" y2="420" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="280" y1="0" x2="280" y2="420" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="420" y1="0" x2="420" y2="420" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="560" y1="0" x2="560" y2="420" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="840" y1="0" x2="840" y2="420" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="980" y1="0" x2="980" y2="420" stroke="#1a2744" stroke-width="0.8"/>
    <line x1="1120" y1="0" x2="1120" y2="420" stroke="#1a2744" stroke-width="0.8"/>

    <!-- Glow blobs -->
    <rect x="0" y="0" width="500" height="420" fill="url(#glowLeft)"/>
    <rect x="700" y="0" width="500" height="420" fill="url(#glowRight)"/>

    <!-- Diagonal neon lines -->
    <line x1="860" y1="0" x2="1020" y2="420" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="910" y1="0" x2="1070" y2="420" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="970" y1="0" x2="1130" y2="420" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="1040" y1="0" x2="1200" y2="280" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.25"/>
    <line x1="810" y1="0" x2="960" y2="420" stroke="#60a5fa" stroke-width="0.6" stroke-opacity="0.2"/>
    <line x1="1080" y1="0" x2="1200" y2="200" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>

    <!-- ============ LEFT CONTENT ============ -->

    <!-- Logo icon -->
    <rect x="56" y="38" width="56" height="56" rx="12" fill="url(#logoIconGrad)"/>
    <path d="M90 46 L76 64 L85 64 L80 80 L95 60 L86 60 Z" fill="#ffffff"/>

    <!-- Logo text -->
    <text x="124" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="0.5">gadget<tspan fill="#60a5fa">zone</tspan></text>
    <text x="126" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" letter-spacing="6">TECH &amp; GADGETS</text>

    <!-- Main headline -->
    <text x="56" y="180" font-family="Arial Black, Impact, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="3">MEGA</text>
    <text x="56" y="272" font-family="Arial Black, Impact, sans-serif" font-size="96" font-weight="900" fill="#3b82f6" letter-spacing="3">SALE</text>

    <!-- Subtitle -->
    <text x="58" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" letter-spacing="6">GADGETURI &amp; ELECTRONICE</text>

    <!-- Discount badge -->
    <rect x="56" y="320" width="360" height="58" rx="4" fill="url(#discountBg)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="56" y="320" width="6" height="58" fill="#3b82f6"/>
    <rect x="410" y="320" width="6" height="58" fill="#3b82f6" rx="0"/>
    <text x="80" y="346" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Reduceri de până la</text>
    <text x="80" y="370" font-family="Arial Black, Impact, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="-0.5">-50%</text>
    <text x="160" y="370" font-family="Arial, sans-serif" font-size="14" fill="#64748b"> la toate categoriile</text>

    <!-- CTA button -->
    <rect x="56" y="390" width="0" height="0" rx="4" fill="url(#btnGrad)"/>

    <!-- ============ RIGHT — Products ============ -->

    <!-- Stage ellipse -->
    <ellipse cx="900" cy="400" rx="280" ry="22" fill="url(#stageGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <ellipse cx="900" cy="400" rx="210" ry="7" fill="#1d4ed8" opacity="0.3"/>

    <!-- ---- BIG MONITOR (center-back) ---- -->
    <rect x="760" y="168" width="280" height="176" rx="6" fill="#141d2e" stroke="#334155" stroke-width="2"/>
    <rect x="772" y="180" width="256" height="148" rx="3" fill="#080e1a"/>
    <!-- Monitor screen scene: abstract game background -->
    <rect x="772" y="180" width="256" height="148" fill="#060c16"/>
    <!-- Background city/sky -->
    <rect x="772" y="180" width="256" height="60" fill="#060c18"/>
    <rect x="772" y="240" width="256" height="88" fill="#050a14"/>
    <!-- City silhouette -->
    <rect x="780" y="220" width="20" height="40" fill="#0a1628"/>
    <rect x="808" y="210" width="16" height="50" fill="#0a1628"/>
    <rect x="830" y="225" width="24" height="35" fill="#0a1628"/>
    <rect x="860" y="205" width="14" height="55" fill="#0a1628"/>
    <rect x="880" y="215" width="30" height="45" fill="#0a1628"/>
    <rect x="916" y="222" width="18" height="38" fill="#0a1628"/>
    <rect x="940" y="208" width="22" height="52" fill="#0a1628"/>
    <rect x="968" y="218" width="16" height="42" fill="#0a1628"/>
    <rect x="990" y="225" width="28" height="35" fill="#0a1628"/>
    <!-- Robot figure center -->
    <ellipse cx="900" cy="222" rx="22" ry="24" fill="#0d1f3c"/>
    <ellipse cx="900" cy="220" rx="14" ry="16" fill="#1a3a6e" opacity="0.9"/>
    <ellipse cx="900" cy="213" rx="10" ry="11" fill="#1d6bb8" opacity="0.95"/>
    <rect x="888" y="222" width="24" height="30" rx="3" fill="#1a5fa0" opacity="0.95"/>
    <rect x="880" y="224" width="9" height="20" rx="3" fill="#1a5fa0" opacity="0.8"/>
    <rect x="911" y="224" width="9" height="20" rx="3" fill="#1a5fa0" opacity="0.8"/>
    <rect x="891" y="250" width="8" height="16" rx="2" fill="#1a4f8a"/>
    <rect x="901" y="250" width="8" height="16" rx="2" fill="#1a4f8a"/>
    <!-- Glowing eyes -->
    <circle cx="895" cy="212" r="3.5" fill="#60a5fa"/>
    <circle cx="905" cy="212" r="3.5" fill="#60a5fa"/>
    <circle cx="895" cy="212" r="1.5" fill="#ffffff"/>
    <circle cx="905" cy="212" r="1.5" fill="#ffffff"/>
    <!-- Monitor stand -->
    <rect x="886" y="344" width="28" height="18" rx="2" fill="#1e293b"/>
    <rect x="862" y="360" width="76" height="10" rx="3" fill="#1e293b"/>
    <!-- MSI brand -->
    <text x="900" y="340" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">MSI</text>

    <!-- ---- PC TOWER (far right) ---- -->
    <rect x="1060" y="188" width="110" height="196" rx="6" fill="#111827" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="1072" y="200" width="86" height="130" rx="3" fill="#0a1120"/>
    <!-- 3 RGB fans -->
    <circle cx="1115" cy="228" r="18" fill="#0d1728" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="1115" cy="228" r="13" fill="#0a1120" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="1115" cy="228" r="6" fill="#1d4ed8" opacity="0.8"/>
    <line x1="1115" y1="215" x2="1115" y2="241" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="1102" y1="228" x2="1128" y2="228" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>

    <circle cx="1115" cy="268" r="18" fill="#0d1728" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="1115" cy="268" r="13" fill="#0a1120" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="1115" cy="268" r="6" fill="#7c3aed" opacity="0.8"/>
    <line x1="1115" y1="255" x2="1115" y2="281" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="1102" y1="268" x2="1128" y2="268" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.5"/>

    <circle cx="1115" cy="308" r="18" fill="#0d1728" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="1115" cy="308" r="13" fill="#0a1120" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="1115" cy="308" r="6" fill="#1d4ed8" opacity="0.8"/>
    <line x1="1115" y1="295" x2="1115" y2="321" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="1102" y1="308" x2="1128" y2="308" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- GPU bar -->
    <rect x="1072" y="338" width="86" height="26" rx="3" fill="#0d1728" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="1115" y="355" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="700">GeForce RTX</text>
    <!-- Light strip -->
    <rect x="1072" y="200" width="5" height="130" rx="2" fill="#3b82f6" opacity="0.7"/>
    <text x="1115" y="390" font-family="Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">REPUBLIC OF GAMERS</text>

    <!-- ---- LAPTOP (front-left) ---- -->
    <rect x="648" y="280" width="200" height="124" rx="6" fill="#141d2e" stroke="#334155" stroke-width="2"/>
    <rect x="660" y="292" width="176" height="100" rx="3" fill="#080e1a"/>
    <!-- Laptop scene -->
    <rect x="660" y="292" width="176" height="100" fill="#060c16"/>
    <rect x="662" y="294" width="172" height="36" fill="#0b1422" opacity="0.9"/>
    <!-- Soldier silhouette -->
    <rect x="726" y="306" width="14" height="38" rx="3" fill="#1a3a6e" opacity="0.95"/>
    <ellipse cx="733" cy="302" rx="9" ry="9" fill="#1a3a6e" opacity="0.95"/>
    <rect x="716" y="316" width="10" height="18" rx="2" fill="#1a3a6e" opacity="0.8"/>
    <rect x="740" y="316" width="10" height="18" rx="2" fill="#1a3a6e" opacity="0.8"/>
    <rect x="724" y="342" width="8" height="20" rx="2" fill="#152d58"/>
    <rect x="734" y="342" width="8" height="20" rx="2" fill="#152d58"/>
    <!-- Explosion -->
    <ellipse cx="780" cy="340" rx="22" ry="14" fill="#7c2d00" opacity="0.75"/>
    <ellipse cx="780" cy="336" rx="14" ry="10" fill="#c2410c" opacity="0.65"/>
    <ellipse cx="780" cy="333" rx="8" ry="6" fill="#f97316" opacity="0.5"/>
    <!-- Laptop base -->
    <rect x="636" y="404" width="244" height="10" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="748" y="388" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">MSI</text>

    <!-- ---- PHONE 1 (center-right) ---- -->
    <rect x="874" y="286" width="54" height="100" rx="9" fill="#1a1a2e" stroke="#334155" stroke-width="1.5"/>
    <rect x="882" y="296" width="38" height="78" rx="4" fill="#0a1628"/>
    <rect x="882" y="296" width="38" height="78" rx="4" fill="#0a1220"/>
    <ellipse cx="901" cy="335" rx="14" ry="18" fill="#0f2545" opacity="0.9"/>
    <ellipse cx="901" cy="332" rx="8" ry="11" fill="#1a3a6e" opacity="0.7"/>
    <rect x="897" y="293" width="10" height="4" rx="2" fill="#0a0e1a"/>
    <rect x="897" y="372" width="10" height="3" rx="1.5" fill="#334155"/>

    <!-- ---- PHONE 2 (right of phone 1) ---- -->
    <rect x="936" y="292" width="50" height="94" rx="9" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="944" y="302" width="34" height="70" rx="3" fill="#0a1120"/>
    <rect x="944" y="302" width="18" height="18" rx="4" fill="#0d1526"/>
    <circle cx="950" cy="308" r="4.5" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="958" cy="308" r="4.5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <rect x="954" y="299" width="10" height="4" rx="2" fill="#0a0e1a"/>

    <!-- ---- MIC (front) ---- -->
    <rect x="825" y="316" width="22" height="50" rx="11" fill="#cc3300"/>
    <rect x="821" y="312" width="30" height="58" rx="15" fill="none" stroke="#991f00" stroke-width="2"/>
    <!-- Mic grill lines -->
    <line x1="823" y1="326" x2="849" y2="326" stroke="#991f00" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="823" y1="334" x2="849" y2="334" stroke="#991f00" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="823" y1="342" x2="849" y2="342" stroke="#991f00" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="823" y1="350" x2="849" y2="350" stroke="#991f00" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="834" y="370" width="4" height="24" fill="#334155"/>
    <rect x="820" y="393" width="32" height="6" rx="3" fill="#334155"/>

    <!-- Stage glow lines -->
    <line x1="620" y1="400" x2="1180" y2="400" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="650" y1="404" x2="1150" y2="404" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- Border -->
    <rect x="0" y="0" width="1200" height="420" rx="18" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <!-- Top neon accent -->
    <line x1="60" y1="1" x2="520" y2="1" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.7"/>
    <!-- Corner dot -->
    <circle cx="22" cy="22" r="5" fill="#3b82f6" opacity="0.6"/>
    <circle cx="1178" cy="22" r="5" fill="#7c3aed" opacity="0.6"/>

  </g>
</svg>
