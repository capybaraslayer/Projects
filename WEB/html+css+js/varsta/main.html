<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator de varsta</title>
    <style>
        body{
            background-color: rgb(36, 94, 243);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container{
            background-color: antiquewhite;    
            min-width: 800px;
            min-height: 300px;
            gap: 20px;
            border-radius: 9px;
        }
        .form_container{
            background-color: rgb(7, 7, 67);
            display: flex;
            align-items: center;
            border-radius: 9px;
            margin: 30px;
            padding: 10px;
            height: 80px;
        }
        .form{
            background-color: white;
            border: none;
            padding: 20px;
            border-radius: 9px;
            color:black;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form_container">
        <input class='form' type="date"> 
        </div>
        <button>Calculeaza</button>
        <h1>Varsta ta este</h1>
        <div class="varsta">Ani</div>
        <div class="varsta">Luni</div>
        <div class="varsta">Zile</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
